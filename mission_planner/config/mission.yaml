# Mission plan read by scripts/mission_sequencer.py.
#
# Tasks are grouped into "waves": each wave is injected `delay` seconds after
# the mission starts, so work can keep arriving instead of being dumped at
# once. Override the file at launch with:
#   ros2 launch mission_planner mission_launch.py mission_file:=/path/to/other.yaml
#
# Fields by task type:
#   I (Inspect)        - waypoints: [{x, y, z}, ...], any number
#   A (InspectPVArray) - waypoints: exactly 2, the tree uses wp[0] and wp[1]
#   M (Monitor)        - human_target_id, distance, number
#   D (DeliverTool)    - tool_id, human_target_id
#
# Valid human_target_id (conf.yaml): human_target_1/2/3
# Valid tool_id (conf.yaml): hammer, wrench, allen_wrench, fixed_wrench,
#                            multimeter, pliers, tweezers
#
# Ids must be unique across the whole plan.
#
# Battery: the drones discharge while flying and reach the low-battery
# threshold after roughly 87 s of accumulated flight, so these waves are long
# enough to exercise the recharge path.

waves:
  # --- Wave 0: start up, one task type per drone ---------------------------
  - delay: 0.0
    tasks:
      # Long inspection sweep (4 points): plenty of flight, drains battery
      - id: t_1
        type: I
        waypoints:
          - {x: 10.0, y: 10.0, z: 5.0}
          - {x: 15.0, y: 10.0, z: 5.0}
          - {x: 15.0, y: 18.0, z: 6.0}
          - {x: 10.0, y: 18.0, z: 6.0}
      # PV array row inspection (type A always takes 2 waypoints)
      - id: t_2
        type: A
        waypoints:
          - {x: -12.0, y: 6.0, z: 5.0}
          - {x: -12.0, y: 22.0, z: 5.0}
      # Monitor a worker
      - id: t_3
        type: M
        human_target_id: human_target_1
        distance: 4.0
        number: 2

  # --- Wave 1: new work arrives while they are still busy ------------------
  - delay: 55.0
    tasks:
      - id: t_4
        type: I
        waypoints:
          - {x: 5.0, y: -15.0, z: 6.0}
          - {x: 12.0, y: -15.0, z: 6.0}
          - {x: 12.0, y: -6.0, z: 7.0}
      # Tool delivery: pick it up at the station and take it to the worker
      - id: t_5
        type: D
        tool_id: multimeter
        human_target_id: human_target_2
      - id: t_6
        type: A
        waypoints:
          - {x: 14.0, y: -20.0, z: 5.0}
          - {x: 14.0, y: -4.0, z: 5.0}

  # --- Wave 2: this is usually where the recharges kick in -----------------
  - delay: 125.0
    tasks:
      - id: t_7
        type: I
        waypoints:
          - {x: -14.0, y: -12.0, z: 7.0}
          - {x: -20.0, y: -12.0, z: 7.0}
          - {x: -20.0, y: -2.0, z: 6.0}
          - {x: -14.0, y: -2.0, z: 6.0}
      - id: t_8
        type: M
        human_target_id: human_target_3
        distance: 5.0
        number: 3
      - id: t_9
        type: D
        tool_id: pliers
        human_target_id: human_target_1

  # --- Wave 3: wrap-up, with the drones already low on battery -------------
  - delay: 200.0
    tasks:
      - id: t_10
        type: A
        waypoints:
          - {x: 20.0, y: 4.0, z: 5.0}
          - {x: 20.0, y: 20.0, z: 5.0}
      - id: t_11
        type: I
        waypoints:
          - {x: -8.0, y: -20.0, z: 8.0}
          - {x: 0.0, y: -22.0, z: 8.0}
          - {x: 8.0, y: -20.0, z: 8.0}
